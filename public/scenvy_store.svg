<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenvystoreTitle">
  <title id="scenvystoreTitle">SCENVY STORE</title>
  <defs>
    <linearGradient id="scenvy_store_bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0E15"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="scenvy_store_accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="scenvy_store_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="96" fill="url(#scenvy_store_bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#scenvy_store_accentGrad)" stroke-width="3" stroke-opacity="0.4" fill="none"/>
  
  <circle cx="256" cy="180" r="140" fill="url(#scenvy_store_accentGrad)" opacity="0.22" filter="url(#scenvy_store_glow)"/>
  
  <g transform="translate(156, 80)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#scenvy_store_accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#0A0E15" fill-opacity="0.85"/>
    <path d="M60 70 H140 L160 160 H40 Z M80 70 A 20 20 0 0 1 120 70" fill="none" stroke="url(#scenvy_store_accentGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <text x="256" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="3">
    SCENVY
  </text>
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#334155" letter-spacing="6">
    STORE
  </text>
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="24" fill="#94A3B8" letter-spacing="2">
    Hardware &amp; More
  </text>
</svg>