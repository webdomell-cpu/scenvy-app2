<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenvyFlowTitle scenvyFlowDesc">
  <title id="scenvyFlowTitle">SCENVY Flow</title>
  <desc id="scenvyFlowDesc">AI Video & Reel Automation icon</desc>

  <defs>
    <linearGradient id="scenvy_flow_bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="scenvy_flow_accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="scenvy_flow_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#scenvy_flow_bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#scenvy_flow_accentGrad)" stroke-width="3" stroke-opacity="0.4" fill="none"/>

  <!-- Ambient Glow Circle -->
  <circle cx="256" cy="200" r="120" fill="url(#scenvy_flow_accentGrad)" opacity="0.22" filter="url(#scenvy_flow_glow)"/>

  <!-- Icon: Reel / Play Node -->
  <g transform="translate(156, 100)">
    <!-- Outer Shield / Circle -->
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#scenvy_flow_accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#090D16" fill-opacity="0.85"/>
    
    <!-- Film Reel Holes -->
    <circle cx="45" cy="45" r="12" fill="url(#scenvy_flow_accentGrad)"/>
    <circle cx="155" cy="45" r="12" fill="url(#scenvy_flow_accentGrad)"/>
    <circle cx="45" cy="155" r="12" fill="url(#scenvy_flow_accentGrad)"/>
    <circle cx="155" cy="155" r="12" fill="url(#scenvy_flow_accentGrad)"/>

    <!-- Play Button Triangle (closed) -->
    <path d="M85 65 L140 100 L85 135 Z" fill="url(#scenvy_flow_accentGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#EC4899" letter-spacing="6">
    FLOW
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    AI Video & Reel Automation
  </text>
</svg>
