<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenvyHostTitle scenvyHostDesc">
  <title id="scenvyHostTitle">SCENVY Host</title>
  <desc id="scenvyHostDesc">Host icon for SCENVY — edge & orchestration</desc>

  <defs>
    <linearGradient id="scenvy_host_bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071024"/>
      <stop offset="100%" stop-color="#00121A"/>
    </linearGradient>
    <linearGradient id="scenvy_host_accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="scenvy_host_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#scenvy_host_bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#scenvy_host_accentGrad)" stroke-width="3" stroke-opacity="0.35" fill="none"/>

  <g transform="translate(156, 120)">
    <rect x="0" y="0" width="200" height="160" rx="20" fill="url(#scenvy_host_accentGrad)"/>
    <rect x="8" y="8" width="184" height="144" rx="16" fill="#071122" fill-opacity="0.9"/>

    <!-- Node blocks -->
    <rect x="18" y="18" width="52" height="40" rx="6" fill="#0B1220" stroke="url(#scenvy_host_accentGrad)" stroke-width="3"/>
    <rect x="70" y="18" width="112" height="40" rx="6" fill="#0B1220" stroke="#0F172A" stroke-width="1"/>

    <rect x="18" y="70" width="52" height="40" rx="6" fill="#0B1220" stroke="#0F172A" stroke-width="1"/>
    <rect x="70" y="70" width="112" height="40" rx="6" fill="#0B1220" stroke="url(#scenvy_host_accentGrad)" stroke-width="3"/>

    <!-- Connections (closed paths) -->
    <path d="M44 58 L44 70" stroke="url(#scenvy_host_accentGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M126 58 L126 70" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="256" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#06B6D4" letter-spacing="4">
    HOST
  </text>
</svg>
