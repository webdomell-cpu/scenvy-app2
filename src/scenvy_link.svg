<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenvyLinkTitle scenvyLinkDesc">
  <title id="scenvyLinkTitle">SCENVY Link</title>
  <desc id="scenvyLinkDesc">Link/Integrations icon for SCENVY</desc>

  <defs>
    <linearGradient id="scenvy_link_bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071129"/>
      <stop offset="100%" stop-color="#00121A"/>
    </linearGradient>
    <linearGradient id="scenvy_link_accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="scenvy_link_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#scenvy_link_bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#scenvy_link_accentGrad)" stroke-width="3" stroke-opacity="0.35" fill="none"/>

  <g transform="translate(136, 116)">
    <rect x="0" y="0" width="240" height="240" rx="48" fill="url(#scenvy_link_accentGrad)"/>
    <rect x="8" y="8" width="224" height="224" rx="40" fill="#071222" fill-opacity="0.92"/>

    <!-- Chain links -->
    <g transform="translate(28,48)">
      <path d="M30 50 a34 34 0 0 1 48 -48 l24 24 a34 34 0 0 1 -48 48" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M134 50 a34 34 0 0 1 -48 48 l-24 -24 a34 34 0 0 1 48 -48" fill="none" stroke="url(#scenvy_link_accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Closed connector -->
      <rect x="86" y="50" width="20" height="14" rx="4" fill="url(#scenvy_link_accentGrad)" stroke="none"/>
    </g>
  </g>

  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="456" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#60A5FA" letter-spacing="4">
    LINK
  </text>
</svg>
