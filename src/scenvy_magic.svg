<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenvyMagicTitle scenvyMagicDesc">
  <title id="scenvyMagicTitle">SCENVY Magic</title>
  <desc id="scenvyMagicDesc">Magic/Automation icon for SCENVY</desc>

  <defs>
    <linearGradient id="scenvy_magic_bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="scenvy_magic_accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="scenvy_magic_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#scenvy_magic_bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#scenvy_magic_accentGrad)" stroke-width="3" stroke-opacity="0.35" fill="none"/>

  <g transform="translate(156, 116)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#scenvy_magic_accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#071227" fill-opacity="0.9"/>

    <!-- Star / Sparkles (closed paths) -->
    <path d="M100 40 L110 74 L146 74 L116 96 L128 130 L100 110 L72 130 L84 96 L54 74 L90 74 Z" fill="url(#scenvy_magic_accentGrad)" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="40" cy="160" r="6" fill="#FDE68A"/>
    <circle cx="160" cy="160" r="6" fill="#FDE68A"/>
  </g>

  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F97316" letter-spacing="6">
    MAGIC
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    Automation & Templates
  </text>
</svg>
