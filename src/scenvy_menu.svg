<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenvyMenuTitle scenvyMenuDesc">
  <title id="scenvyMenuTitle">SCENVY Menu</title>
  <desc id="scenvyMenuDesc">Menu / Content Management icon for SCENVY</desc>
  <defs>
    <linearGradient id="scenvy_menu_bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081225"/>
      <stop offset="100%" stop-color="#00121A"/>
    </linearGradient>
    <linearGradient id="scenvy_menu_accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="scenvy_menu_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#scenvy_menu_bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#scenvy_menu_accentGrad)" stroke-width="3" stroke-opacity="0.35" fill="none"/>

  <g transform="translate(156, 116)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#scenvy_menu_accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#071225" fill-opacity="0.9"/>

    <!-- Menu list (closed rounded rects) -->
    <rect x="28" y="34" width="144" height="22" rx="6" fill="#0B1220" stroke="#0F172A" stroke-width="1"/>
    <rect x="28" y="72" width="144" height="22" rx="6" fill="#0B1220" stroke="#0F172A" stroke-width="1"/>
    <rect x="28" y="110" width="144" height="22" rx="6" fill="#0B1220" stroke="#0F172A" stroke-width="1"/>

    <!-- Toggle / handle -->
    <circle cx="44" cy="45" r="6" fill="url(#scenvy_menu_accentGrad)"/>
    <circle cx="44" cy="83" r="6" fill="url(#scenvy_menu_accentGrad)"/>
    <circle cx="44" cy="121" r="6" fill="url(#scenvy_menu_accentGrad)"/>

    <!-- Decorative underline (closed path) -->
    <path d="M28 156 H172" stroke="url(#scenvy_menu_accentGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#06B6D4" letter-spacing="6">
    MENU
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    Content Management
  </text>
</svg>
