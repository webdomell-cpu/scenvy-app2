<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scenvyStoreTitle scenvyStoreDesc">
  <title id="scenvyStoreTitle">SCENVY Store</title>
  <desc id="scenvyStoreDesc">Store / Commerce icon for SCENVY</desc>

  <defs>
    <linearGradient id="scenvy_store_bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071129"/>
      <stop offset="100%" stop-color="#000A12"/>
    </linearGradient>
    <linearGradient id="scenvy_store_accentGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="scenvy_store_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#scenvy_store_bgGrad)"/>
  <rect x="2" y="2" width="508" height="508" rx="94" stroke="url(#scenvy_store_accentGrad)" stroke-width="3" stroke-opacity="0.35" fill="none"/>

  <g transform="translate(156, 116)">
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#scenvy_store_accentGrad)"/>
    <rect x="6" y="6" width="188" height="188" rx="42" fill="#071227" fill-opacity="0.9"/>

    <!-- Store / Tag icon (closed paths) -->
    <path d="M40 60 H132 L160 88 V152 L132 180 H40 V60 Z" fill="url(#scenvy_store_accentGrad)" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
    <circle cx="72" cy="96" r="8" fill="#FFFFFF"/>
    <rect x="40" y="38" width="120" height="16" rx="6" fill="#071227" fill-opacity="0.9"/>
  </g>

  <text x="256" y="375" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="2">
    SCENVY
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F97316" letter-spacing="6">
    STORE
  </text>
  <text x="256" y="455" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    Commerce & Inventory
  </text>
</svg>
